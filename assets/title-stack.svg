<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 44" width="830" height="44" role="img" aria-label="TECH STACK"><style>.m{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,'Courier New',monospace}.s{font-family:'Inter','Segoe UI',-apple-system,Helvetica,Arial,sans-serif}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes tw{0%,100%{opacity:.14}50%{opacity:.95}}
@keyframes blf{0%,49%{fill-opacity:1}50%,100%{fill-opacity:0}}
@keyframes sw{from{transform:translateX(0)}to{transform:translateX(1100px)}}
@keyframes dr1{from{transform:translate(0,0)}to{transform:translate(40px,24px)}}
@keyframes dr2{from{transform:translate(0,0)}to{transform:translate(-36px,18px)}}
@keyframes pu{0%{r:4;opacity:.7}100%{r:13;opacity:0}}
@keyframes gl{0%,88%{opacity:0;transform:translate(0,0)}89%{opacity:.85;transform:translate(-4px,1px)}91%{opacity:0}93%{opacity:.8;transform:translate(4px,-1px)}95%,100%{opacity:0}}
@keyframes cyc{0%{opacity:0;transform:translateY(8px)}3%{opacity:1;transform:translateY(0)}30%{opacity:1;transform:translateY(0)}33%{opacity:0;transform:translateY(-8px)}100%{opacity:0}}
@keyframes shoot{0%{transform:translate(0,0);opacity:0}1%{opacity:1}8%{transform:translate(300px,146px);opacity:0}100%{transform:translate(300px,146px);opacity:0}}
@keyframes pan{0%,100%{opacity:.5}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}.cyc{opacity:0}.c0{opacity:1}.tw{opacity:.3}</style>
<defs><linearGradient id="l" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset="1" stop-color="#22D3EE"/></linearGradient>
<linearGradient id="r" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4C9AFF"/><stop offset="1" stop-color="#4C9AFF" stop-opacity="0"/></linearGradient></defs>
<rect x="90" y="21.5" width="220" height="1.5" fill="url(#l)"/>
<rect x="520" y="21.5" width="220" height="1.5" fill="url(#r)"/>
<text class="m" x="415" y="27" font-size="14" font-weight="700" letter-spacing="6" text-anchor="middle" fill="#22D3EE">// <tspan fill="#E6EBFF">TECH STACK</tspan></text>
</svg>
