<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 352" width="830" height="352" role="img" aria-labelledby="ht hd"><title id="ht">Aashir Farooq, Software Engineer</title><desc id="hd">SaaS products that real teams rely on, built end to end. Available to build. Working worldwide. 2+ years building products, 5+ products shipped, 2,459 total contributions, longest streak 13 days.</desc><style>.m{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,'Courier New',monospace}.s{font-family:'Inter','Segoe UI',-apple-system,Helvetica,Arial,sans-serif}
