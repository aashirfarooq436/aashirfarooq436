@keyframes shoot{0%{transform:translate(0,0);opacity:0}1%{opacity:1}8%{transform:translate(300px,146px);opacity:0}100%{transform:translate(300px,146px);opacity:0}}
@keyframes pan{0%,100%{opacity:.5}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}.cyc{opacity:0}.c0{opacity:1}.tw{opacity:.3}</style>
