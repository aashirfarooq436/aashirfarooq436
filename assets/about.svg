<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 292" width="830" height="292" role="img" aria-label="Five production SaaS products shipped as lead, core or sole engineer. Clean/Hexagonal Architecture, DDD and SOLID: business rules free of frameworks. AI in production: realtime voice agents, LLM routing, voice synthesis, AI redaction. Multi-tenant auth, role-based access, Stripe billing, credit systems, deployment. Ask me about backend architecture, realtime voice AI and SaaS billing."><style>.m{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,'Courier New',monospace}.s{font-family:'Inter','Segoe UI',-apple-system,Helvetica,Arial,sans-serif}
