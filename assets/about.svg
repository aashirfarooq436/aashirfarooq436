<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 268" width="830" height="268" role="img"><style>.m{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,'Courier New',monospace}.s{font-family:'Inter','Segoe UI',-apple-system,Helvetica,Arial,sans-serif}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.9}}
@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes blf{0%,49%{fill-opacity:1}50%,100%{fill-opacity:0}}
@keyframes sw{from{transform:translateX(0)}to{transform:translateX(1100px)}}
@keyframes dr1{from{transform:translate(0,0)}to{transform:translate(40px,24px)}}
@keyframes dr2{from{transform:translate(0,0)}to{transform:translate(-36px,18px)}}
@keyframes pu{0%{r:4;opacity:.7}100%{r:13;opacity:0}}
@keyframes gl{0%,88%{opacity:0;transform:translate(0,0)}89%{opacity:.85;transform:translate(-4px,1px)}91%{opacity:0}93%{opacity:.8;transform:translate(4px,-1px)}95%,100%{opacity:0}}
@keyframes cyc{0%{opacity:0;transform:translateY(8px)}3%{opacity:1;transform:translateY(0)}30%{opacity:1;transform:translateY(0)}33%{opacity:0;transform:translateY(-8px)}100%{opacity:0}}
@keyframes gp{0%,100%{opacity:.45}50%{opacity:.95}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><clipPath id="card"><rect width="830" height="268" rx="20"/></clipPath><linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4C9AFF" stop-opacity=".6"/><stop offset=".5" stop-color="#8B7BFF" stop-opacity=".2"/><stop offset="1" stop-color="#FF5CAA" stop-opacity=".6"/></linearGradient></defs><g clip-path="url(#card)">
<rect width="830" height="268" fill="#0E1424"/>
<rect width="830" height="44" fill="#0B1020"/>
<circle cx="28" cy="22" r="6" fill="#FF5F57"/><circle cx="49" cy="22" r="6" fill="#FEBC2E"/><circle cx="70" cy="22" r="6" fill="#28C840"/>
<text class="m" x="415" y="26" font-size="12" text-anchor="middle" fill="#8A96BD">about.md</text>
<rect y="44" width="830" height="1" fill="#1D2744"/>
<text class="m" x="32" y="76" font-size="13.5" fill="#3DDC97">$ <tspan fill="#E6EBFF">cat about.md</tspan></text>
<g style="animation:fu .6s ease-out 0.5s both"><text class="m" x="32" y="112" font-size="13" fill="#22D3EE">▸</text><text class="m" x="54" y="112" font-size="13.5" fill="#E6EBFF">Five production SaaS products shipped as lead, core or sole engineer.</text></g><g style="animation:fu .6s ease-out 0.8s both"><text class="m" x="32" y="142" font-size="13" fill="#22D3EE">▸</text><text class="m" x="54" y="142" font-size="13.5" fill="#E6EBFF">Clean/Hexagonal Architecture, DDD and SOLID: business rules free of frameworks.</text></g><g style="animation:fu .6s ease-out 1.1s both"><text class="m" x="32" y="172" font-size="13" fill="#22D3EE">▸</text><text class="m" x="54" y="172" font-size="13.5" fill="#E6EBFF">AI in production: realtime voice agents, LLM routing, voice synthesis, AI redaction.</text></g><g style="animation:fu .6s ease-out 1.4s both"><text class="m" x="32" y="202" font-size="13" fill="#22D3EE">▸</text><text class="m" x="54" y="202" font-size="13.5" fill="#E6EBFF">Multi-tenant auth, role-based access, Stripe billing, credit systems, deployment.</text></g><g style="animation:fu .6s ease-out 1.7s both"><text class="m" x="32" y="232" font-size="13" fill="#22D3EE">▸</text><text class="m" x="54" y="232" font-size="13.5" fill="#E6EBFF">Ask me about backend architecture, realtime voice AI and SaaS billing.<tspan fill="#3DDC97" style="animation:blf 1s steps(1) infinite"> &#9608;</tspan></text></g>
</g>
<rect x=".5" y=".5" width="829" height="267" rx="19.5" fill="none" stroke="url(#bd)"/>
</svg>