<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 64" width="830" height="64" role="img"><style>.m{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,'Courier New',monospace}.s{font-family:'Inter','Segoe UI',-apple-system,Helvetica,Arial,sans-serif}
@keyframes fu{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes tw{0%,100%{opacity:.12}50%{opacity:.9}}
@keyframes bl{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes blf{0%,49%{fill-opacity:1}50%,100%{fill-opacity:0}}
@keyframes sw{from{transform:translateX(0)}to{transform:translateX(1100px)}}
@keyframes dr1{from{transform:translate(0,0)}to{transform:translate(40px,24px)}}
@keyframes dr2{from{transform:translate(0,0)}to{transform:translate(-36px,18px)}}
@keyframes pu{0%{r:4;opacity:.7}100%{r:13;opacity:0}}
@keyframes gl{0%,88%{opacity:0;transform:translate(0,0)}89%{opacity:.85;transform:translate(-4px,1px)}91%{opacity:0}93%{opacity:.8;transform:translate(4px,-1px)}95%,100%{opacity:0}}
@keyframes cyc{0%{opacity:0;transform:translateY(8px)}3%{opacity:1;transform:translateY(0)}30%{opacity:1;transform:translateY(0)}33%{opacity:0;transform:translateY(-8px)}100%{opacity:0}}
@keyframes gp{0%,100%{opacity:.45}50%{opacity:.95}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="fl" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#4C9AFF" stop-opacity="0"/><stop offset=".5" stop-color="#8B7BFF"/><stop offset="1" stop-color="#FF5CAA" stop-opacity="0"/></linearGradient><linearGradient id="swp" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient></defs><rect x="40" y="14" width="750" height="2" fill="url(#fl)"/><rect x="-160" y="13" width="160" height="4" fill="url(#swp)" style="animation:sw 6s linear infinite"/><text class="m" x="415" y="46" font-size="13" letter-spacing="1" text-anchor="middle" fill="#8A96BD">// still shipping<tspan fill="#3DDC97" style="animation:blf 1s steps(1) infinite"> &#9608;</tspan></text></svg>