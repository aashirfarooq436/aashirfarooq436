<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 830 108" width="830" height="108" role="img" aria-label="2+ years building products, 5+ products shipped, 170+ users on one platform"><style>.m{font-family:'JetBrains Mono','Fira Code','SF Mono',Consolas,'Courier New',monospace}.s{font-family:'Inter','Segoe UI',-apple-system,Helvetica,Arial,sans-serif}
